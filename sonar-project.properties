sonar.projectKey=clockwise
sonar.projectName=Clockwise
sonar.projectVersion=1.0

sonar.sources=clockwise-server/src,clockwise-dashboard/src,clockwise-dashboard/src-tauri/src,clockwise-ui/src,clockwise-app/src,clockwise-common/components,clockwise-common/lib
sonar.tests=clockwise-server/test,clockwise-dashboard/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.javascript.lcov.reportPaths=clockwise-server/coverage/lcov.info,clockwise-dashboard/coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Rust (Tauri Backend)
sonar.rust.clippy.reportPaths=clockwise-dashboard/src-tauri/clippy-report.json

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/src-tauri/target/**,**/src-tauri/bin/**,**/src-tauri/gen/**
