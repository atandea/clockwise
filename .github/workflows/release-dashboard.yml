name: release-dashboard

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to release, for example 1.2.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: clockwise-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_sha: ${{ steps.commit.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          VERSION=$(node scripts/set-version.mjs '${{ inputs.version }}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release changelog
        run: node scripts/generate-changelog.mjs --unreleased

      - name: Commit release version
        id: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add clockwise-ui/package.json clockwise-ui/package-lock.json \
            clockwise-ui/src-tauri/tauri.conf.json clockwise-ui/src-tauri/Cargo.toml \
            clockwise-server/package.json clockwise-server/package-lock.json
          git add -f -- CHANGELOG.md changelog.json
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git push
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    uses: ./.github/workflows/build-dashboard.yml
    with:
      publish: true
      version: ${{ needs.prepare.outputs.version }}
      release_sha: ${{ needs.prepare.outputs.release_sha }}
    secrets: inherit