name: 'build-dashboard'

on:
  push:
    branches:
      - main
    paths:
      - 'clockwise-dashboard/**'
      - 'clockwise-server/**'
      - '.github/workflows/build-dashboard.yml'
  pull_request:
    paths:
      - 'clockwise-dashboard/**'
      - 'clockwise-server/**'
      - '.github/workflows/build-dashboard.yml'

jobs:
  build-tauri:
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-latest'
            args: '--bundles deb'
            sidecar_target: 'node24-linux-x64'
            sidecar_ext: ''
            sidecar_triple: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install system dependencies (linux only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ''

      - name: install dependencies
        run: |
          cd clockwise-server && npm ci
          cd ../clockwise-dashboard && npm ci

      - name: Build Server Sidecar
        working-directory: ./clockwise-server
        shell: bash
        run: |
          npm run build
          # Build frontend and copy to server for bundling
          cd ../clockwise-dashboard && npm run build
          cd ../clockwise-server
          mkdir -p client
          cp -r ../clockwise-dashboard/build/* client/
          # Ensure bin directory exists
          mkdir -p ../clockwise-dashboard/src-tauri/bin
          # Build sidecar using pkg
          npx @yao-pkg/pkg@latest . -t ${{ matrix.sidecar_target }} --output ../clockwise-dashboard/src-tauri/bin/clockwise-server-${{ matrix.sidecar_triple }}${{ matrix.sidecar_ext }}

      - name: Build Dashboard (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ 
          releaseName: 'Clockwise Dashboard v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: ./clockwise-dashboard

      - name: Delete old artifacts
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const { data: { artifacts } } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `clockwise-dashboard-${{ matrix.platform }}`
            });
            for (const artifact of artifacts) {
              console.log(`Deleting artifact: ${artifact.name} (${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clockwise-dashboard-${{ matrix.platform }}
          path: |
            clockwise-dashboard/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn