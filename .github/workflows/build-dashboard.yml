name: 'build-dashboard'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - main
    paths:
      - 'clockwise-dashboard/**'
      - 'clockwise-server/**'
      - '.github/workflows/build-dashboard.yml'
  pull_request:
    paths:
      - 'clockwise-dashboard/**'
      - 'clockwise-server/**'
      - '.github/workflows/build-dashboard.yml'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      changelog_body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version
        id: get_version
        working-directory: ./clockwise-dashboard
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          node ./scripts/generate-changelog.mjs --unreleased --output ./clockwise-dashboard
          BODY=$(cat ./clockwise-dashboard/CHANGELOG.md)
          # Use GitHub Actions multi-line output
          echo "body<<CHANGELOG_EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "CHANGELOG_EOF" >> $GITHUB_OUTPUT

      - name: Delete existing release/tag
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const tag = `app-v${{ steps.get_version.outputs.version }}`;
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              console.log(`Deleting release ${release.id}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });
            } catch (e) {
              console.log('No release found for tag ' + tag);
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              console.log(`Deleted tag ${tag}`);
            } catch (e) {
              console.log('No tag found for ' + tag);
            }

  build-tauri:
    needs: cleanup
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-latest'
            args: '--bundles deb'
            sidecar_target: 'node24-linux-x64'
            sidecar_ext: ''
            sidecar_triple: 'x86_64-unknown-linux-gnu'
            artifact_pattern: 'target/release/bundle/deb/*.deb'
          - platform: 'windows-latest'
            args: '--bundles msi'
            sidecar_target: 'node24-win-x64'
            sidecar_ext: '.exe'
            sidecar_triple: 'x86_64-pc-windows-msvc'
            artifact_pattern: 'target/release/bundle/msi/*.msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install system dependencies (linux only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ''

      - name: install dependencies
        run: |
          cd clockwise-server && npm ci
          cd ../clockwise-dashboard && npm ci

      - name: Build Server Sidecar
        working-directory: ./clockwise-server
        shell: bash
        run: |
          npm run build
          # Build frontend and copy to server for bundling
          cd ../clockwise-dashboard && npm run build
          cd ../clockwise-server
          mkdir -p client
          cp -r ../clockwise-dashboard/build/* client/
          # Ensure bin directory exists
          mkdir -p ../clockwise-dashboard/src-tauri/bin
          # Build sidecar using pkg
          npx @yao-pkg/pkg@latest . -t ${{ matrix.sidecar_target }} --output ../clockwise-dashboard/src-tauri/bin/clockwise-server-${{ matrix.sidecar_triple }}${{ matrix.sidecar_ext }}

      - name: Build Dashboard (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v${{ needs.cleanup.outputs.version }}
          releaseName: 'Clockwise Dashboard v${{ needs.cleanup.outputs.version }}'
          releaseBody: ${{ needs.cleanup.outputs.changelog_body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: ./clockwise-dashboard

      - name: Build Arch Linux Package
        if: matrix.platform == 'ubuntu-latest'
        run: |
          VERSION="${{ needs.cleanup.outputs.version }}"
          cp clockwise-dashboard/src-tauri/target/release/bundle/deb/clockwise-dashboard_${VERSION}_amd64.deb pkgbuild/clockwise-dashboard_${VERSION}_amd64.deb
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/pkgbuild \
            archlinux:latest \
            bash -c "
              pacman -Sy --noconfirm --needed fakeroot binutils nodejs
              useradd -m builder
              chown -R builder:builder /workspace/pkgbuild /workspace/clockwise-dashboard
              su builder -c 'makepkg -df'
            "

      - name: Upload Arch Linux Package to Release
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = `app-v${{ needs.cleanup.outputs.version }}`;
            const pkgDir = 'pkgbuild';
            const files = fs.readdirSync(pkgDir);
            const pkgFile = files.find(f => f.endsWith('.pkg.tar.zst'));
            if (!pkgFile) {
              console.log('No .pkg.tar.zst file found, skipping upload');
              return;
            }
            const pkgPath = path.join(pkgDir, pkgFile);
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: pkgFile,
                data: fs.readFileSync(pkgPath)
              });
              console.log(`Uploaded ${pkgFile} to release`);
            } catch (e) {
              console.log(`Failed to upload ${pkgFile}:`, e.message);
            }

      - name: Delete old artifacts
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const { data: { artifacts } } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `clockwise-dashboard-${{ matrix.platform }}`
            });
            for (const artifact of artifacts) {
              console.log(`Deleting artifact: ${artifact.name} (${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clockwise-dashboard-${{ matrix.platform }}
          path: |
            clockwise-dashboard/src-tauri/${{ matrix.artifact_pattern }}
            pkgbuild/*.pkg.tar.zst
          if-no-files-found: warn

      - name: Upload changelog.json to release
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const tag = `app-v${{ needs.cleanup.outputs.version }}`;
            const changelogPath = 'clockwise-dashboard/changelog.json';
            if (!fs.existsSync(changelogPath)) {
              console.log('changelog.json not found, skipping upload');
              return;
            }
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: 'changelog.json',
                data: fs.readFileSync(changelogPath)
              });
              console.log('Uploaded changelog.json to release');
            } catch (e) {
              console.log('Failed to upload changelog.json:', e.message);
            }