name: build-dashboard

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [main]
    paths:
      - 'clockwise-ui/**'
      - 'clockwise-server/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'clockwise-ui/**'
      - 'clockwise-server/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_call:
    inputs:
      publish:
        required: false
        type: boolean
        default: false
      version:
        required: false
        type: string
        default: ''

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: '--bundles deb'
            sidecar_target: node26-linux-x64
            sidecar_ext: ''
            sidecar_triple: x86_64-unknown-linux-gnu
            artifact_pattern: target/release/bundle/deb/*.deb
          - platform: windows-latest
            args: '--bundles msi'
            sidecar_target: node26-win-x64
            sidecar_ext: '.exe'
            sidecar_triple: x86_64-pc-windows-msvc
            artifact_pattern: target/release/bundle/msi/*.msi

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        if: inputs.publish
        run: node scripts/set-version.mjs '${{ inputs.version }}'

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: install system dependencies (linux only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies
        run: |
          cd clockwise-server && npm ci
          cd ../clockwise-ui && npm ci

      - name: Build Server Sidecar
        working-directory: ./clockwise-server
        shell: bash
        run: |
          npm run build
          cd ../clockwise-ui && npm run build
          cd ../clockwise-server
          mkdir -p ../clockwise-ui/src-tauri/bin
          npx @yao-pkg/pkg@latest . -t ${{ matrix.sidecar_target }} --output ../clockwise-ui/src-tauri/bin/clockwise-server-${{ matrix.sidecar_triple }}${{ matrix.sidecar_ext }}

      - name: Build Dashboard (verify)
        if: ${{ !inputs.publish }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
          projectPath: ./clockwise-ui

      - name: Build Dashboard (release)
        if: inputs.publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v${{ inputs.version }}
          releaseName: Clockwise v${{ inputs.version }}
          releaseBody: Release ${{ inputs.version }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: ./clockwise-ui

      - name: Build Arch Linux Package
        if: matrix.platform == 'ubuntu-latest'
        run: |
          VERSION=$(node -p "require('./clockwise-ui/package.json').version")
          mkdir -p pkgbuild
          cp PKGBUILD pkgbuild/PKGBUILD
          DEB_FILE=$(find clockwise-ui/src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name "*_${VERSION}_amd64.deb" -print -quit)
          if [ -z "$DEB_FILE" ]; then
            echo "No Debian bundle found in clockwise-ui/src-tauri/target/release/bundle/deb" >&2
            exit 1
          fi
          cp "$DEB_FILE" "pkgbuild/clockwise_${VERSION}_amd64.deb"
          docker run --rm -v "$PWD:/workspace" -w /workspace/pkgbuild archlinux:latest bash -c "pacman -Sy --noconfirm --needed fakeroot binutils nodejs debugedit && useradd -m builder && chown -R builder:builder /workspace/pkgbuild /workspace/clockwise-ui && su builder -c 'makepkg -df'"

      - name: Upload Arch Linux Package to Release
        if: matrix.platform == 'ubuntu-latest' && inputs.publish
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = `app-v${{ inputs.version }}`;
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag });
            const pkgFile = fs.readdirSync('pkgbuild').find(file => file.endsWith('.pkg.tar.zst'));
            if (pkgFile) await github.rest.repos.uploadReleaseAsset({ owner: context.repo.owner, repo: context.repo.repo, release_id: release.id, name: pkgFile, data: fs.readFileSync(path.join('pkgbuild', pkgFile)) });

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clockwise-${{ matrix.platform }}
          path: |
            clockwise-ui/src-tauri/${{ matrix.artifact_pattern }}
            pkgbuild/*.pkg.tar.zst
          if-no-files-found: warn
